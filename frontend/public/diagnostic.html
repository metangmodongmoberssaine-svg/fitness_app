<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Diagnostic caméra et décompte</title>
<style>
  :root { color-scheme: dark; }
  body { font-family: 'Segoe UI', system-ui, sans-serif; background: #0d0d10; color: #f5f5f7; margin: 0; padding: 2rem 1rem; }
  .wrap { max-width: 820px; margin: 0 auto; }
  h1 { font-size: 1.6rem; margin: 0 0 .3rem; } p.sub { color: #b4b4c0; margin: 0 0 1.5rem; }
  .step { display: flex; gap: .9rem; background: #16161b; border: 1px solid rgba(255,255,255,.08); border-radius: 16px;
          padding: .9rem 1.1rem; margin-bottom: .6rem; }
  .ico { width: 26px; flex: none; font-size: 1.2rem; text-align: center; }
  .ok { color: #4ade80; } .ko { color: #ff6b6b; } .wait { color: #b4b4c0; } .warn { color: #ffb84d; }
  .step b { display: block; } .step small { color: #b4b4c0; line-height: 1.5; display: block; margin-top: .15rem; }
  button { background: #c8f05a; color: #111; border: 0; border-radius: 999px; padding: .75rem 1.4rem; font-weight: 700;
           cursor: pointer; font-size: .95rem; margin: .4rem .5rem .4rem 0; font-family: inherit; }
  button.sec { background: #1f1f26; color: #f5f5f7; border: 1px solid rgba(255,255,255,.12); }
  .views { display: grid; grid-template-columns: 1fr 1fr; gap: .8rem; margin: 1rem 0; }
  .views div { position: relative; background: #000; border-radius: 14px; overflow: hidden; aspect-ratio: 16/9; }
  video, canvas { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
  textarea { width: 100%; height: 190px; background: #16161b; color: #f5f5f7; border: 1px solid rgba(255,255,255,.12);
             border-radius: 14px; padding: .8rem; font-family: Consolas, monospace; font-size: .8rem; box-sizing: border-box; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Diagnostic caméra et décompte</h1>
  <p class="sub">Cliquez sur « Lancer le diagnostic », puis sur « Tester ma caméra ». Copiez ensuite le rapport en bas et envoyez-le.</p>
  <button id="go">Lancer le diagnostic</button>
  <button id="cam" class="sec" disabled>Tester ma caméra (10 s)</button>
  <div id="steps"></div>
  <div class="views"><div><video id="v" muted playsinline></video></div><div><canvas id="c"></canvas></div></div>
  <button id="copy" class="sec">Copier le rapport</button>
  <textarea id="rapport" readonly placeholder="Le rapport apparaît ici."></textarea>
</div>

<script>
const LOCAL = '/vendor/mediapipe/', CDN = 'https://cdn.jsdelivr.net/npm/@mediapipe/';
const steps = document.getElementById('steps'), rapport = [];
let poseBase = null, pose = null, lastResults = null;
const $ = (id) => document.getElementById(id);

function ligne(titre) {
  const d = document.createElement('div'); d.className = 'step';
  d.innerHTML = '<div class="ico wait">…</div><div><b></b><small></small></div>';
  d.querySelector('b').textContent = titre; steps.appendChild(d);
  return (etat, detail) => {
    const i = d.querySelector('.ico');
    i.className = 'ico ' + etat; i.textContent = { ok: '✔', ko: '✘', warn: '!', wait: '…' }[etat];
    d.querySelector('small').textContent = detail || '';
    const r = rapport.findIndex(x => x.t === titre);
    const entree = { t: titre, e: etat, d: detail || '' };
    if (r >= 0) rapport[r] = entree; else rapport.push(entree);
    $('rapport').value = 'RAPPORT DE DIAGNOSTIC\n' + rapport.map(x => `[${{ok:'OK',ko:'ÉCHEC',warn:'ATTENTION',wait:'...'}[x.e]}] ${x.t} : ${x.d}`).join('\n')
      + '\nNavigateur : ' + navigator.userAgent;
  };
}
function charger(src) {
  return new Promise((ok, ko) => { const s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = () => { s.remove(); ko(new Error('introuvable')); }; document.head.appendChild(s); });
}
const angle = (a, b, c) => {
  const ba = [a.x - b.x, a.y - b.y], bc = [c.x - b.x, c.y - b.y];
  const n = Math.hypot(...ba) * Math.hypot(...bc); if (!n) return 180;
  return Math.acos(Math.max(-1, Math.min(1, (ba[0]*bc[0] + ba[1]*bc[1]) / n))) * 180 / Math.PI;
};

async function diagnostic() {
  steps.innerHTML = ''; rapport.length = 0; $('cam').disabled = true;

  let s = ligne('1. Adresse de la page');
  s(window.isSecureContext ? 'ok' : 'ko', location.href + (window.isSecureContext ? '' : '  -> la caméra est bloquée : ouvrez http://localhost:8000'));

  s = ligne('2. Accélération graphique (WebGL)');
  const gl = document.createElement('canvas').getContext('webgl2') || document.createElement('canvas').getContext('webgl');
  if (!gl) s('ko', 'WebGL indisponible : activez « l\'accélération matérielle » dans les paramètres du navigateur (Système).');
  else { const ext = gl.getExtension('WEBGL_debug_renderer_info'); const nom = ext ? gl.getParameter(ext.UNMASKED_RENDERER_WEBGL) : 'inconnu';
         s(/swiftshader|software|llvmpipe/i.test(nom) ? 'warn' : 'ok', nom + (/swiftshader|software|llvmpipe/i.test(nom) ? ' (rendu logiciel : l\'analyse sera lente)' : '')); }

  s = ligne('3. Chargement de MediaPipe');
  try { await charger(LOCAL + 'pose/pose.js'); poseBase = LOCAL + 'pose/'; s('ok', 'copie LOCALE utilisée (vendor/mediapipe)'); }
  catch (e) {
    try { await charger(CDN + 'pose/pose.js'); poseBase = CDN + 'pose/'; s('warn', 'copie locale absente : chargé depuis internet (jsdelivr). Pour la version locale : python telecharger_mediapipe.py'); }
    catch (e2) { s('ko', 'impossible : pas de copie locale ET jsdelivr inaccessible. Lancez « python telecharger_mediapipe.py » (avec internet).'); return; }
  }

  s = ligne('4. Démarrage du moteur d\'analyse');
  const t0 = performance.now();
  try {
    pose = new Pose({ locateFile: (f) => poseBase + f });
    pose.setOptions({ modelComplexity: 1, smoothLandmarks: true, minDetectionConfidence: 0.5, minTrackingConfidence: 0.5 });
    pose.onResults((r) => { lastResults = r; });
    await pose.initialize();
    s('ok', `prêt en ${((performance.now() - t0) / 1000).toFixed(1)} s`);
  } catch (e) { s('ko', 'échec : ' + (e.message || e)); return; }

  s = ligne('5. Décompte sur la vidéo de test (squat.mp4, 8 s)');
  const v = $('v'); v.srcObject = null; v.src = '/samples/squat.mp4'; v.loop = true;
  try { await v.play(); } catch (e) { s('ko', 'vidéo illisible : ' + e.message); return; }
  const res = await mesurer(v, 8000, [23, 25, 27], [24, 26, 28]);
  s(res.det > 0 ? (res.fps >= 8 ? 'ok' : 'warn') : 'ko',
    `${res.n} images analysées (${res.fps} images/s), personne détectée dans ${res.pct} % ; angle du genou ${res.min}° à ${res.max}°`
    + (res.fps < 8 && res.det > 0 ? ' : analyse lente' : '') + (res.det === 0 ? ' : AUCUNE détection, le moteur ne fonctionne pas' : ''));
  v.pause();
  $('cam').disabled = false;
}

async function mesurer(v, duree, g, d) {
  const c = $('c'); const ctx = c.getContext('2d');
  let n = 0, det = 0, mn = 999, mx = 0; const t0 = performance.now();
  while (performance.now() - t0 < duree) {
    lastResults = null; await pose.send({ image: v }); n++;
    if (c.width !== v.videoWidth) { c.width = v.videoWidth; c.height = v.videoHeight; }
    ctx.drawImage(v, 0, 0, c.width, c.height);
    const lm = lastResults && lastResults.poseLandmarks;
    if (lm) {
      det++;
      if (window.drawConnectors && window.POSE_CONNECTIONS) { drawConnectors(ctx, lm, POSE_CONNECTIONS, { color: '#c8f05a', lineWidth: 4 }); }
      const P = (i) => ({ x: lm[i].x * c.width, y: lm[i].y * c.height });
      const a = (angle(P(g[0]), P(g[1]), P(g[2])) + angle(P(d[0]), P(d[1]), P(d[2]))) / 2;
      mn = Math.min(mn, a); mx = Math.max(mx, a);
    }
    await new Promise(r => setTimeout(r, 0));
  }
  const sec = (performance.now() - t0) / 1000;
  return { n, det, pct: Math.round(100 * det / Math.max(n, 1)), fps: +(n / sec).toFixed(1), min: det ? Math.round(mn) : '-', max: det ? Math.round(mx) : '-' };
}

async function testCamera() {
  $('cam').disabled = true;
  let s = ligne('6. Accès à la caméra');
  let stream;
  try { stream = await navigator.mediaDevices.getUserMedia({ video: { width: { ideal: 1280 }, height: { ideal: 720 }, facingMode: 'user' } }); }
  catch (e) {
    const m = { NotAllowedError: 'REFUSÉ : cadenas à gauche de l\'adresse > Caméra > Autoriser (et Windows : Paramètres > Confidentialité > Caméra).',
                NotFoundError: 'aucune caméra détectée (branchée ? activée ?).',
                NotReadableError: 'caméra déjà utilisée par un autre programme (Teams, Zoom, autre onglet) : fermez-les.' }[e.name] || e.message;
    s('ko', e.name + ' : ' + m); $('cam').disabled = false; return;
  }
  const piste = stream.getVideoTracks()[0], st = piste.getSettings();
  s('ok', `${piste.label || 'caméra'} (${st.width}x${st.height})`);
  const v = $('v'); v.src = ''; v.srcObject = stream; await v.play();

  s = ligne('7. Décompte avec la caméra (10 s) : bougez ou faites des squats de profil');
  await new Promise(r => setTimeout(r, 800));
  const res = await mesurer(v, 10000, [23, 25, 27], [24, 26, 28]);
  stream.getTracks().forEach(t => t.stop());
  let etat = 'ok', msg = `${res.n} images (${res.fps} images/s), personne détectée dans ${res.pct} %`;
  if (res.det === 0) { etat = 'ko'; msg += ' : le moteur ne voit personne. Reculez pour que tout le corps soit visible, améliorez l\'éclairage.'; }
  else { msg += ` ; angle du genou ${res.min}° à ${res.max}°`;
    if (res.pct < 60) { etat = 'warn'; msg += ' : détection instable (corps coupé ou trop sombre).'; }
    if (res.fps < 8) { etat = 'warn'; msg += ' : analyse lente.'; } }
  s(etat, msg);
  $('cam').disabled = false;
}

$('go').onclick = () => diagnostic();
$('cam').onclick = () => testCamera();
$('copy').onclick = () => { $('rapport').select(); document.execCommand('copy'); $('copy').textContent = 'Copié ✔'; setTimeout(() => $('copy').textContent = 'Copier le rapport', 2000); };
// Utilitaires de dessin (facultatifs)
charger(LOCAL + 'drawing_utils/drawing_utils.js').catch(() => charger(CDN + 'drawing_utils/drawing_utils.js')).catch(() => {});
</script>
</body>
</html>
